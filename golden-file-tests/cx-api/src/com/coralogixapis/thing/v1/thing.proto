syntax = "proto3";

package com.coralogixapis.thing.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/api/field_behavior.proto";
import "google/api/visibility.proto";
import "protoc-gen-openapiv3/options/annotations.proto";

// Thing is a thing.
message Thing {
  option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_schema) = {
    discriminator: {
      property_name: "thing_type"
      mapping: {
        key: "THING_TYPE_STANDARD"
        value: "#/components/schemas/Thing"
      },
      mapping: {
        key: "THING_TYPE_PREMIUM"
        value: "#/components/schemas/Thing"
      }
    }
  };
  // ID is the unique identifier of the thing.
  string id = 1 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {example: "\"123e4567-e89b-12d3-a456-426614174000\""}];

  // Name of the thing.
  string name = 2 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {example: "\"A Thing's Name\""}];

  // Creation timestamp of the thing.
  optional google.protobuf.Timestamp created_at = 4 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {example: "\"2021-01-01T00:00:00Z\""}];
  NestedStruct nested_field = 5;
  string preview_field = 6 [(google.api.field_visibility).restriction = "PREVIEW"];
  ThingType thing_type = 7 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {example: "\"THING_TYPE_STANDARD\""}];
  oneof polymorphic_field {
    PolymorphicVariantA variant_a = 8;
    PolymorphicVariantB variant_b = 9;
  }
  ThingSettings settings = 10;
}

// ThingSettings shows the proto facts that the generator copies to OpenAPI.
message ThingSettings {
  // An optional scalar tracks presence. A bool default is a boolean.
  optional bool enabled = 1 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "true"}];
  // An optional enum tracks presence. The keys go next to the $ref.
  optional ThingType tier = 2 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "THING_TYPE_STANDARD"}];
  // An annotated optional enum keeps its allOf wrapper.
  optional ThingType previous_tier = 3 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {description: "The previous tier."}];
  // An int64 is a JSON string, so its default stays text.
  int64 max_size = 4 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "100"}];
  // A double default is a number.
  double ratio = 5 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "0.5"}];
  // A default that does not convert is copied as text.
  int32 retries = 6 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "many"}];
  // An unordered list is a set. An array default is an array.
  repeated string labels = 7 [
    (google.api.field_behavior) = UNORDERED_LIST,
    (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {default: "[]"}
  ];
  repeated ThingType types = 8 [(google.api.field_behavior) = UNORDERED_LIST];
  // The server sets these fields.
  string revision = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  NestedStruct owner_details = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> tags = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // REQUIRED does not add a required entry: json_schema.required is the source.
  string owner = 13 [(google.api.field_behavior) = REQUIRED];
  // UNORDERED_LIST is ignored on a scalar and on a map.
  string note = 14 [(google.api.field_behavior) = UNORDERED_LIST];
  map<string, string> attributes = 15 [(google.api.field_behavior) = UNORDERED_LIST];
  // Map limits are copied. A required map declares min_properties: 1.
  map<string, string> selectors = 16 [(grpc.gateway.protoc_gen_openapiv3.options.openapiv3_field) = {min_properties: 1 max_properties: 20}];
}

message NestedStruct { 
  int32 numeric_field = 1;
  string string_field = 2;
}

message PolymorphicVariantA {
  string field_a = 1;
}

message PolymorphicVariantB {
  int32 field_b = 1;
}

enum ThingType {
  option (grpc.gateway.protoc_gen_openapiv3.options.openapiv3_enum) = {
    title: "ThingType"
    description: "The type of the thing."
  };

  THING_TYPE_UNSPECIFIED = 0;

  THING_TYPE_STANDARD = 1;

  THING_TYPE_PREMIUM = 2;
}
